<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Overlay live</title>
<!--
  Overlay delle statistiche live per la trasmissione (vMix / OBS, sorgente "pagina web"): sfondo trasparente,
  palco fisso 1920x1080 scalato alla finestra. Pagina STATICA: si carica su qualsiasi hosting (es. Aruba).
  Indirizzo: https://<dominio>/overlay.html?t=<token>   (aggiungere &debug=1 per vedere lo stato del collegamento)
  Legge lo snapshot dalla funzione pubblica live_overlay di Supabase (chiave pubblica "publishable": è fatta per stare nelle pagine web;
  senza il token, lungo e casuale, non restituisce nulla). Gli stessi dati servono ai titoli GT di vMix come Data Source JSON.
-->
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; color: #fff; }
  #palco { position: fixed; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: top left; }
  #debug { position: absolute; left: 12px; top: 8px; font-size: 22px; background: #000a; padding: 4px 10px; display: none; }
  #barra { position: absolute; left: 120px; right: 120px; bottom: 56px; background: rgba(11,18,32,.93); border-radius: 24px;
           border: 2px solid #ffffff22; padding: 28px 40px 18px; box-shadow: 0 12px 40px #0008; display: none; }
  #testa { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 32px; }
  .squadra { display: flex; align-items: center; gap: 22px; }
  .squadra.casa { justify-content: flex-end; text-align: right; color: #38bdf8; }
  .squadra.ospite { justify-content: flex-start; text-align: left; color: #fbbf24; }
  .squadra .nome { font-size: 46px; font-weight: 700; line-height: 1.1; }
  .squadra img { height: 110px; max-width: 160px; object-fit: contain; }
  #setvinti { font-size: 88px; font-weight: 800; letter-spacing: 2px; min-width: 260px; text-align: center; }
  #setvinti .c { color: #38bdf8; } #setvinti .o { color: #fbbf24; } #setvinti .sep { opacity: .5; margin: 0 18px; }
  #tabella { margin-top: 22px; display: grid; row-gap: 6px; align-items: center; }
  .testa-col { text-align: center; font-size: 26px; font-weight: 700; letter-spacing: 2px; opacity: .7; border-bottom: 2px solid #ffffff22; padding-bottom: 6px; }
  .etichetta { font-size: 26px; font-weight: 700; letter-spacing: 1.5px; opacity: .85; padding: 10px 0; }
  .coppia { display: flex; justify-content: center; align-items: baseline; gap: 14px; font-size: 44px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .coppia.grande { font-size: 54px; }
  .coppia .v { min-width: 100px; } .coppia .v.c { text-align: right; color: #38bdf8; } .coppia .v.o { text-align: left; color: #fbbf24; }
  .coppia .v.meno { opacity: .55; }
  .coppia .sep { opacity: .3; font-size: .6em; }
  #roster { position: absolute; left: 120px; right: 120px; bottom: 56px; background: rgba(11,18,32,.93); border-radius: 24px;
            border: 2px solid #ffffff22; padding: 28px 40px 18px; box-shadow: 0 12px 40px #0008; display: none; }
  #rtesta { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 32px; }
  #rtesta .centro { text-align: center; font-size: 30px; letter-spacing: 3px; font-weight: 700; opacity: .8; min-width: 300px; }
  #rcorpo { margin-top: 22px; display: grid; grid-template-columns: 1fr 1fr; gap: 64px; }
  .campo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .zona { text-align: center; background: #ffffff10; border-radius: 16px; padding: 10px 6px; min-height: 112px; }
  .zona .n { font-size: 58px; font-weight: 800; line-height: 1.05; }
  .zona .cg { font-size: 26px; font-weight: 600; }
  .blocco.casa .n, .blocco.casa .lab { color: #38bdf8; } .blocco.ospite .n, .blocco.ospite .lab { color: #fbbf24; }
  .riga { font-size: 25px; margin-top: 10px; opacity: .92; } .riga .lab { font-weight: 700; letter-spacing: 2px; margin-right: 10px; }
  #elenco { position: absolute; left: 120px; right: 120px; bottom: 56px; background: rgba(11,18,32,.93); border-radius: 24px;
            border: 2px solid #ffffff22; padding: 24px 40px 14px; box-shadow: 0 12px 40px #0008; display: none; }
  #etesta { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 32px; }
  #etesta .centro { text-align: center; font-size: 30px; letter-spacing: 3px; font-weight: 700; opacity: .8; min-width: 300px; }
  #ecorpo { margin-top: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 64px; }
  .riga-g { display: grid; grid-template-columns: 74px 1fr 190px; align-items: baseline; font-size: 32px; padding: 3px 0; border-bottom: 1px solid #ffffff14; }
  .riga-g .n { font-weight: 800; text-align: right; padding-right: 18px; }
  .riga-g .r { font-size: 22px; letter-spacing: 1.5px; opacity: .7; text-align: right; }
  .staff-g { font-size: 24px; margin-top: 10px; opacity: .9; } .staff-g .lab { font-weight: 700; letter-spacing: 2px; margin-right: 10px; }
  #marchioE { margin-top: 10px; display: flex; justify-content: flex-end; align-items: center; gap: 16px; font-size: 36px; opacity: .95; }
  #marchioE img { width: 64px; height: 64px; }
  .par { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 26px; font-weight: 600; opacity: .9; font-variant-numeric: tabular-nums; }
  .par .c { color: #38bdf8; } .par .o { color: #fbbf24; } .par .t { opacity: .4; margin: 0 4px; }
  #migliori { margin-top: 14px; padding-top: 14px; border-top: 2px solid #ffffff22; display: grid; grid-template-columns: 1fr auto 1fr; gap: 32px; align-items: center; }
  #migliori .centro { font-size: 24px; letter-spacing: 2px; opacity: .7; font-weight: 700; }
  .mig { font-size: 36px; font-weight: 700; }
  .mig small { font-size: 26px; font-weight: 400; opacity: .75; margin-left: 10px; }
  .mig.casa { text-align: right; color: #38bdf8; } .mig.ospite { text-align: left; color: #fbbf24; }
  #marchio, #marchioR { margin-top: 14px; display: flex; justify-content: flex-end; align-items: center; gap: 16px; font-size: 40px; opacity: .95; }
  #marchio img, #marchioR img { width: 76px; height: 76px; }
</style>
</head>
<body>
<div id="palco">
  <div id="debug"></div>
  <!-- Vista formazioni (?v=roster): squadre in campo a inizio partita/set -->
  <div id="roster">
    <div id="rtesta">
      <div class="squadra casa"><div class="nome" id="rNomeC"></div><img id="rlogoC" alt="" hidden></div>
      <div class="centro" id="rSet">FORMAZIONI</div>
      <div class="squadra ospite"><img id="rlogoO" alt="" hidden><div class="nome" id="rNomeO"></div></div>
    </div>
    <div id="rcorpo"><div class="blocco casa" id="rBloccoC"></div><div class="blocco ospite" id="rBloccoO"></div></div>
    <div id="marchioR"><img src="pallone-96.png" alt=""><span>Dati forniti da <b>XLSuiteVolley</b></span></div>
  </div>
  <!-- Vista elenco (?v=elenco): tutti i giocatori delle due squadre, in colonna, con numero e ruolo -->
  <div id="elenco">
    <div id="etesta">
      <div class="squadra casa"><div class="nome" id="eNomeC"></div><img id="elogoC" alt="" hidden></div>
      <div class="centro">ELENCO GIOCATORI</div>
      <div class="squadra ospite"><img id="elogoO" alt="" hidden><div class="nome" id="eNomeO"></div></div>
    </div>
    <div id="ecorpo"><div class="blocco casa" id="eBloccoC"></div><div class="blocco ospite" id="eBloccoO"></div></div>
    <div id="marchioE"><img src="pallone-96.png" alt=""><span>Dati forniti da <b>XLSuiteVolley</b></span></div>
  </div>
  <div id="barra">
    <div id="testa">
      <div class="squadra casa"><div class="nome" id="nomeC"></div><img id="logoC" alt="" hidden></div>
      <div id="setvinti"><span class="c" id="vintiC">0</span><span class="sep">–</span><span class="o" id="vintiO">0</span></div>
      <div class="squadra ospite"><img id="logoO" alt="" hidden><div class="nome" id="nomeO"></div></div>
    </div>
    <div id="tabella"></div>
    <div id="migliori"><div class="mig casa" id="migC"></div><div class="centro">MIGLIOR REALIZZATORE</div><div class="mig ospite" id="migO"></div></div>
    <!-- Marchio: fisso -->
    <div id="marchio"><img src="pallone-96.png" alt=""><span>Dati forniti da <b>XLSuiteVolley</b></span></div>
  </div>
</div>
<script>
(function () {
  var SUPABASE_URL = "https://soxkjdnwjhhtebrhzqjf.supabase.co";
  var SUPABASE_KEY = "sb_publishable_mrWIGr8KCc_pgDgmR_U37A_3IWNLS1M";
  var PERIODO_MS = 3000;

  var q = new URLSearchParams(location.search);
  var token = (q.get("t") || "").trim().toLowerCase();
  var debug = q.has("debug");
  var $ = function (id) { return document.getElementById(id); };
  var palco = $("palco"), barra = $("barra"), dbg = $("debug"), tab = $("tabella");
  if (debug) dbg.style.display = "block";
  function stato(t) { dbg.textContent = t; }

  function adatta() {
    palco.style.transform = "scale(" + Math.min(innerWidth / 1920, innerHeight / 1080) + ")";
  }
  addEventListener("resize", adatta); adatta();

  var perc = function (v) { return v == null || isNaN(v) ? "–" : Math.round(v * 100) + "%"; };
  var num = function (v) { return v == null ? "–" : String(v); };
  var RIGHE = [
    ["ATTACCO %", function (l) { return l && l.A && l.A.pp; }, perc],
    ["RICEZIONE POSITIVA %", function (l) { return l && l.R && l.R.pp; }, perc],
    ["MURI", function (l) { return l && l.B && l.B.pt; }, num]
  ];

  function el(tag, cls, testo) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (testo != null) e.textContent = testo;
    return e;
  }
  function coppia(c, o, f, grande) {
    var d = el("div", "coppia" + (grande ? " grande" : ""));
    var migliorC = c != null && o != null && c > o, migliorO = c != null && o != null && o > c;
    d.appendChild(el("span", "v c" + (migliorC || c === o ? "" : " meno"), f(c)));
    d.appendChild(el("span", "sep", "|"));
    d.appendChild(el("span", "v o" + (migliorO || c === o ? "" : " meno"), f(o)));
    return d;
  }

  function disegna(s) {
    var sets = (s.sets || []).slice().sort(function (a, b) { return a.n - b.n; });
    if (!sets.length) { barra.style.display = "none"; return; }
    $("nomeC").textContent = (s.casa && s.casa.nome) || "";
    $("nomeO").textContent = (s.ospite && s.ospite.nome) || "";
    $("vintiC").textContent = (s.setVinti && s.setVinti.c) || 0;
    $("vintiO").textContent = (s.setVinti && s.setVinti.o) || 0;

    tab.style.gridTemplateColumns = "300px repeat(" + (sets.length + 1) + ", 1fr)";
    tab.textContent = "";
    var totC = 0, totO = 0;
    tab.appendChild(el("div"));
    sets.forEach(function (x) { tab.appendChild(el("div", "testa-col", "SET " + x.n + (x.inCorso ? " ●" : ""))); totC += x.c; totO += x.o; });
    tab.appendChild(el("div", "testa-col", "TOTALE"));

    tab.appendChild(el("div", "etichetta", "PUNTI"));
    sets.forEach(function (x) { tab.appendChild(coppia(x.c, x.o, num, true)); });
    tab.appendChild(coppia(totC, totO, num, true));

    // Parziali ai time-out tecnici (8, 16, 21 punti) di ciascun set
    if (sets.some(function (x) { return x.par && x.par.length; })) {
      tab.appendChild(el("div", "etichetta", "PARZIALI"));
      sets.forEach(function (x) {
        var p = el("div", "par");
        (x.par || []).forEach(function (t) {
          var r = el("div");
          r.appendChild(el("span", "c", String(t[0]))); r.appendChild(el("span", "t", "–")); r.appendChild(el("span", "o", String(t[1])));
          p.appendChild(r);
        });
        tab.appendChild(p);
      });
      tab.appendChild(el("div"));
    }

    RIGHE.forEach(function (r) {
      tab.appendChild(el("div", "etichetta", r[0]));
      sets.forEach(function (x) { tab.appendChild(coppia(r[1](x.sq && x.sq.c), r[1](x.sq && x.sq.o), r[2])); });
      tab.appendChild(coppia(r[1](s.tot && s.tot.c), r[1](s.tot && s.tot.o), r[2]));
    });
    realizzatore($("migC"), s.migliori && s.migliori.c);
    realizzatore($("migO"), s.migliori && s.migliori.o);
    barra.style.display = "block";
  }

  // Miglior realizzatore fino a ora: maglia, nome e punti (attacchi + muri + ace)
  function realizzatore(box, m) {
    box.textContent = "";
    if (!m) { box.textContent = "–"; return; }
    box.appendChild(document.createTextNode(m.num + "  " + (m.nome || "")));
    box.appendChild(el("small", null, m.pt + " pt (" + m.att + " att · " + m.mu + " muri · " + m.ace + " ace)"));
  }

  // ---- Vista formazioni: ?v=roster (&set=N per la formazione di un altro set; di base il set 1) ----
  var vistaRoster = q.get("v") === "roster";
  var setRoster = parseInt(q.get("set") || "1", 10) || 1;
  var rost = $("roster");

  function riga(box, etichetta, giocatori) {
    if (!giocatori.length) return;
    var d = el("div", "riga");
    d.appendChild(el("span", "lab", etichetta));
    d.appendChild(document.createTextNode(giocatori.map(function (g) { return g.num + " " + g.cogn + (g.cap ? " (C)" : ""); }).join("  ·  ")));
    box.appendChild(d);
  }

  function blocco(box, sq, zone) {
    box.textContent = "";
    var g = (sq && sq.g) || [], per = {}, inCampo = {};
    g.forEach(function (x) { per[x.num] = x; });
    if (zone) {
      var campo = el("div", "campo");
      [4, 3, 2, 5, 6, 1].forEach(function (z) {            // riga d'attacco 4-3-2, riga di difesa 5-6-1
        var n = zone[z - 1], p = per[n];
        inCampo[n] = 1;
        var c = el("div", "zona");
        c.appendChild(el("div", "n", String(n)));
        c.appendChild(el("div", "cg", p ? p.cogn + (p.cap ? " (C)" : "") : ""));
        campo.appendChild(c);
      });
      box.appendChild(campo);
    }
    riga(box, "LIBERO", g.filter(function (x) { return x.lib && !inCampo[x.num]; }));
    riga(box, zone ? "PANCHINA" : "DISTINTA", g.filter(function (x) { return !x.lib && !inCampo[x.num]; }));
    if (sq && sq.all) {
      var s = el("div", "riga");
      s.appendChild(el("span", "lab", "ALLENATORE"));
      s.appendChild(document.createTextNode(sq.all + (sq.ass ? "   ·   2° " + sq.ass : "")));
      box.appendChild(s);
    }
  }

  function disegnaRoster(s) {
    if (!s.roster) { rost.style.display = "none"; return; }
    $("rNomeC").textContent = (s.casa && s.casa.nome) || "";
    $("rNomeO").textContent = (s.ospite && s.ospite.nome) || "";
    $("rSet").textContent = "FORMAZIONI · SET " + setRoster;
    var f = s.formazioni && s.formazioni[String(setRoster)];
    blocco($("rBloccoC"), s.roster.c, f && f.c);
    blocco($("rBloccoO"), s.roster.o, f && f.o);
    rost.style.display = "block";
  }

  // ---- Vista elenco: ?v=elenco ----
  var vistaElenco = q.get("v") === "elenco";
  var RUOLI = { 1: "LIBERO", 2: "BANDA", 3: "OPPOSTO", 4: "CENTRALE", 5: "PALLEGGIO" };

  function bloccoElenco(box, sq) {
    box.textContent = "";
    var g = ((sq && sq.g) || []).slice().sort(function (a, b) { return a.num - b.num; });
    g.forEach(function (x) {
      var r = el("div", "riga-g");
      r.appendChild(el("div", "n", String(x.num)));
      var nome = x.cogn + (x.nome ? " " + x.nome.charAt(0) + "." : "") + (x.cap ? "  (C)" : "");
      r.appendChild(el("div", "c", nome));
      r.appendChild(el("div", "r", x.lib && !x.ruolo ? "LIBERO" : (RUOLI[x.ruolo] || "")));
      box.appendChild(r);
    });
    if (sq && sq.all) {
      var s = el("div", "staff-g");
      s.appendChild(el("span", "lab", "ALLENATORE"));
      s.appendChild(document.createTextNode(sq.all + (sq.ass ? "   ·   2° " + sq.ass : "")));
      box.appendChild(s);
    }
  }

  function disegnaElenco(s) {
    if (!s.roster) { $("elenco").style.display = "none"; return; }
    $("eNomeC").textContent = (s.casa && s.casa.nome) || "";
    $("eNomeO").textContent = (s.ospite && s.ospite.nome) || "";
    bloccoElenco($("eBloccoC"), s.roster.c);
    bloccoElenco($("eBloccoO"), s.roster.o);
    $("elenco").style.display = "block";
  }

  function logo(id, url) {
    var i = $(id);
    if (url) { if (i.src !== url) i.src = url; i.hidden = false; } else { i.hidden = true; }
  }

  var loghiCaricati = false, haLoghi = false;
  function giro() {
    if (!/^[a-f0-9]{64}$/.test(token)) { stato("link non valido (manca ?t=…)"); return; }
    var chiediLoghi = haLoghi && !loghiCaricati;
    fetch(SUPABASE_URL + "/rest/v1/rpc/live_overlay", {
      method: "POST", cache: "no-store",
      headers: { "Content-Type": "application/json", apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY },
      body: JSON.stringify({ p_token: token, p_loghi: chiediLoghi })
    }).then(function (r) {
      if (!r.ok) throw new Error("errore " + r.status);
      return r.json();
    }).then(function (d) {
      if (!d) { stato("link non valido o chiuso"); return; }
      if (d.snapshot && Object.keys(d.snapshot).length) { if (vistaElenco) disegnaElenco(d.snapshot); else if (vistaRoster) disegnaRoster(d.snapshot); else disegna(d.snapshot); }
      haLoghi = !!d.ha_loghi;
      if (d.loghi) {
        logo("logoC", d.loghi.casa); logo("logoO", d.loghi.ospite);
        logo("rlogoC", d.loghi.casa); logo("rlogoO", d.loghi.ospite);
        logo("elogoC", d.loghi.casa); logo("elogoO", d.loghi.ospite);
        loghiCaricati = true;
      }
      stato("ok · " + new Date().toLocaleTimeString("it-IT"));
    }).catch(function (e) {
      stato("rete non raggiungibile (si riprova): " + e.message);
    }).then(function () { setTimeout(giro, PERIODO_MS); });
  }
  giro();
})();
</script>
</body>
</html>
